services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: agripulse_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t agripulse/healthcheck -m ok -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - agripulse

  postgres:
    image: postgres:15-alpine
    container_name: agripulse_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: agripulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agripulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - agripulse

  # Milestone 1: IoT sensor simulator → MQTT
  simulator:
    build: ./simulator
    container_name: agripulse_simulator
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      PUBLISH_INTERVAL_SEC: 5
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agripulse

  # Milestone 3: FastAPI ingestion + REST/WebSocket API
  backend:
    build: ./backend
    container_name: agripulse_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/agripulse
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_TOPIC: agripulse/telemetry/#
      TEMP_MIN_C: 2.0
      TEMP_MAX_C: 8.0
      ALERT_COOLDOWN_SEC: 60
    depends_on:
      mqtt-broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - agripulse

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:

networks:
  agripulse:
    driver: bridge
