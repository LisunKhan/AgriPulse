services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: agripulse_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t agripulse/healthcheck -m ok -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - agripulse

  postgres:
    image: postgres:15-alpine
    container_name: agripulse_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-agripulse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - agripulse

  simulator:
    build: ./simulator
    container_name: agripulse_simulator
    environment:
      MQTT_HOST: ${MQTT_HOST:-mqtt-broker}
      MQTT_PORT: ${MQTT_PORT:-1883}
      PUBLISH_INTERVAL_SEC: ${PUBLISH_INTERVAL_SEC:-5}
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agripulse

  backend:
    build: ./backend
    container_name: agripulse_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password123@postgres:5432/agripulse}
      MQTT_HOST: ${MQTT_HOST:-mqtt-broker}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-agripulse/telemetry/#}
      TEMP_MIN_C: ${TEMP_MIN_C:-2.0}
      TEMP_MAX_C: ${TEMP_MAX_C:-8.0}
      HUMIDITY_MIN_PCT: ${HUMIDITY_MIN_PCT:-40.0}
      HUMIDITY_MAX_PCT: ${HUMIDITY_MAX_PCT:-90.0}
      ALERT_COOLDOWN_SEC: ${ALERT_COOLDOWN_SEC:-60}
    depends_on:
      mqtt-broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - agripulse

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/telemetry}
    container_name: agripulse_web
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agripulse

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:

networks:
  agripulse:
    driver: bridge
